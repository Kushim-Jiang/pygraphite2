[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygraphite2"
version = "0.1.0"
description = "Cross-platform Python binding to SIL Graphite2 text shaping (vendored SIL ctypes binding, runtime native-lib discovery)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR MPL-2.0 OR LGPL-2.1-or-later OR GPL-2.0-or-later" }
dependencies = ["fonttools>=4.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
# Pure-Python package. The native libgraphite2 is NOT compiled in — it is
# discovered at runtime (PYGRAPHITE2_LIBRARY_PATH → system → vendor/ dir),
# so this wheel is platform-independent.
packages = ["pygraphite2", "pygraphite2.graphite2"]
