name: Native tracing build

# Builds a tracing-enabled graphite2 library (GRAPHITE2_NTRACING off) from the
# pinned upstream source and verifies the per-pass shaping trace actually works
# on all three supported OSes. This is the guarantee that tracing is
# cross-platform, not just Windows.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-tracing:
    name: "tracing (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # Pin the exact upstream source instead of letting the build script clone
      # by raw SHA (shallow fetches of a bare SHA can be flaky on GitHub).
      - name: Fetch pinned graphite2 source
        uses: actions/checkout@v4
        with:
          repository: silnrsi/graphite
          ref: ca8d821e60a15b6c24e404c9086992c975d8e1cf
          path: .graphite-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Show toolchain (macOS, preinstalled)
        if: runner.os == 'macOS'
        run: cmake --version && g++ --version

      - name: Install toolchain (Windows, MSYS2 mingw64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      - name: Install package (editable + dev extras)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build tracing-enabled library
        shell: bash
        run: python scripts/build_tracing_lib.py --source .graphite-src --out _gr2lib

      - name: Verify trace against built library
        shell: bash
        env:
          PYGRAPHITE2_LIBRARY_PATH: ${{ github.workspace }}/_gr2lib
        run: |
          python - <<'EOF'
          import pygraphite2 as pg
          print("library:", pg.library_info().path)
          with pg.GraphiteFont.from_bytes(open("vendor/fonts/Padauk-Regular.ttf", "rb").read()) as f:
              assert f.tracing_supported(), "tracing not compiled in"
              stages = f.shape_trace("\u1019\u103c\u1014\u103a\u1019\u102c", script="mymr").stages
              print("stages:", len(stages), [s.m for s in stages])
              assert len(stages) >= 3, "expected Start/passes/End stages"
          print("TRACE OK")
          EOF

      - name: Run full test suite (trace tests active)
        shell: bash
        env:
          PYGRAPHITE2_LIBRARY_PATH: ${{ github.workspace }}/_gr2lib
        run: pytest
