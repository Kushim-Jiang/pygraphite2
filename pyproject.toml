[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pygraphite2"
version = "0.2.0"
description = "Cross-platform, fully typed Python binding to SIL Graphite2 text shaping"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR MPL-2.0 OR GPL-2.0-or-later"
authors = [{ name = "pygraphite2 contributors" }]
keywords = [
    "graphite2",
    "graphite",
    "shaping",
    "complex scripts",
    "text",
    "fonts",
    "ctypes",
    "fonttools",
    "smaragd",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Fonts",
    "Typing :: Typed",
]
dependencies = [
    "fonttools>=4.0",
]

[project.urls]
Homepage = "https://github.com/example/pygraphite2"
Documentation = "https://github.com/example/pygraphite2#readme"
Issues = "https://github.com/example/pygraphite2/issues"

[project.optional-dependencies]
# Development / CI tooling. Install with: uv sync --extra dev   (or pip install -e ".[dev]")
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # mypy 2.x dropped support for targeting Python 3.9; pin <2 so we can keep
    # checking against the minimum supported runtime (requires-python >= 3.9).
    "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pygraphite2"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/vendor",
    "/examples",
    "/scripts",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE.md",
    "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "native: requires the graphite2 native library (auto-skipped when absent)",
    "golden: requires the Padauk test font (auto-skipped when absent)",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "examples", "scripts"]
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# E501 is disabled: `ruff format` is the source of truth for line breaking and
# deliberately does not wrap long lines, so a line-length lint rule would fight
# the formatter (and cause churn on every re-format).
# B008: ctypes callbacks used as default values in _binding are intentional.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.9"
strict = true
# Type-check the package itself. Tests are validated by pytest/ruff (following
# imports into pytest's own source pulls in 3.10+ syntax mypy can't parse on the
# py39 target).
files = ["src"]
warn_unused_ignores = true
# fontTools ships partial type info; treat it as Any for our purposes.
[[tool.mypy.overrides]]
module = ["fontTools.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pygraphite2._binding"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pygraphite2._loader", "pygraphite2._font"]
# ctypes' dynamically-attributed CDLL functions are untyped; values are
# converted to concrete types at the call sites.
disallow_any_expr = false
check_untyped_defs = true
